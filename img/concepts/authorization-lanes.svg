<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">Three authorization contexts, not one universal key</title>
<desc id="desc">Search access and permission to remote evidence are separate checks.</desc>
<rect width="1440" height="950" fill="white"/>
<text x="40" y="54" fill="#000000" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="40" dy="0">Three authorization contexts, not one universal key</tspan></text>
<text x="40" y="101" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">Search access and permission to remote evidence are separate checks.</tspan></text>
<text x="40" y="917" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">CONCEPT ILLUSTRATION | Not a portal view, deployed state or saved query result.</tspan></text>
<rect x="40" y="170" width="380" height="175" rx="12" fill="#EAF4FC" stroke="#0078D4" stroke-width="2"/>
<text x="60" y="208" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="60" dy="0">Search service</tspan></text>
<text x="60" y="263" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="60" dy="0">Lab admin key</tspan></text>
<polyline points="420,255 510,255" fill="none" stroke="#0078D4" stroke-width="3"/>
<polyline points="500,249 510,255 500,261" fill="none" stroke="#0078D4" stroke-width="3"/>
<rect x="510" y="170" width="890" height="175" rx="12" fill="#EAF4FC" stroke="#0078D4" stroke-width="2"/>
<text x="535" y="212" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="535" dy="0">Create Search objects and access document retrieval.</tspan><tspan x="535" dy="31.9">Also authenticates the Part 5 MCP connection.</tspan></text>
<rect x="40" y="385" width="380" height="175" rx="12" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/>
<text x="60" y="423" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="60" dy="0">Fabric</tspan></text>
<text x="60" y="478" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="60" dy="0">Delegated user token</tspan></text>
<polyline points="420,470 510,470" fill="none" stroke="#107C41" stroke-width="3"/>
<polyline points="500,464 510,470 500,476" fill="none" stroke="#107C41" stroke-width="3"/>
<rect x="510" y="385" width="890" height="175" rx="12" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/>
<text x="535" y="427" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="535" dy="0">query_source_authorization</tspan><tspan x="535" dy="31.9">Remote access is evaluated for the signed-in user.</tspan></text>
<rect x="40" y="600" width="380" height="175" rx="12" fill="#F9EAF5" stroke="#A32988" stroke-width="2"/>
<text x="60" y="638" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="60" dy="0">Work IQ</tspan></text>
<text x="60" y="693" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="60" dy="0">Work IQ user assertion</tspan></text>
<polyline points="420,685 510,685" fill="none" stroke="#A32988" stroke-width="3"/>
<polyline points="500,679 510,685 500,691" fill="none" stroke="#A32988" stroke-width="3"/>
<rect x="510" y="600" width="890" height="175" rx="12" fill="#F9EAF5" stroke="#A32988" stroke-width="2"/>
<text x="535" y="642" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="535" dy="0">query_work_iq_source_authorization</tspan><tspan x="535" dy="31.9">App/federation trust supports the on-behalf-of flow.</tspan></text>
<text x="65" y="835" fill="#000000" font-size="20" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="65" dy="0">Never print keys, tokens or assertions. An admin key does not grant Fabric workspace or Microsoft 365</tspan><tspan x="65" dy="29.0">permissions.</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc">
<title id="title">From a policy file to searchable passages</title>
<desc id="desc">Ingestion prepares evidence. Retrieval later selects relevant passages for a question.</desc>
<rect width="1440" height="740" fill="white"/>
<text x="40" y="54" fill="#000000" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="40" dy="0">From a policy file to searchable passages</tspan></text>
<text x="40" y="101" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">Ingestion prepares evidence. Retrieval later selects relevant passages for a question.</tspan></text>
<text x="40" y="707" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">CONCEPT ILLUSTRATION | Not a portal view, deployed state or saved query result.</tspan></text>
<rect x="40" y="185" width="310" height="230" rx="12" fill="#F1ECF8" stroke="#7052A3" stroke-width="2"/>
<text x="60" y="223" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="60" dy="0">1  Read</tspan></text>
<text x="60" y="278" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="60" dy="0">Extract text from</tspan><tspan x="60" dy="27.55">the uploaded file.</tspan></text>
<polyline points="350,290 390,290" fill="none" stroke="#0078D4" stroke-width="3"/>
<polyline points="380,284 390,290 380,296" fill="none" stroke="#0078D4" stroke-width="3"/>
<rect x="390" y="185" width="310" height="230" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="410" y="223" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="410" dy="0">2  Split</tspan></text>
<text x="410" y="278" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="410" dy="0">Keep smaller passages</tspan><tspan x="410" dy="27.55">with source metadata.</tspan></text>
<polyline points="700,290 740,290" fill="none" stroke="#0078D4" stroke-width="3"/>
<polyline points="730,284 740,290 730,296" fill="none" stroke="#0078D4" stroke-width="3"/>
<rect x="740" y="185" width="310" height="230" rx="12" fill="#F1ECF8" stroke="#7052A3" stroke-width="2"/>
<text x="760" y="223" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="760" dy="0">3  Embed</tspan></text>
<text x="760" y="278" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="760" dy="0">Represent each passage</tspan><tspan x="760" dy="27.55">as a numeric vector.</tspan></text>
<polyline points="1050,290 1090,290" fill="none" stroke="#0078D4" stroke-width="3"/>
<polyline points="1080,284 1090,290 1080,296" fill="none" stroke="#0078D4" stroke-width="3"/>
<rect x="1090" y="185" width="310" height="230" rx="12" fill="#EAF4FC" stroke="#0078D4" stroke-width="2"/>
<text x="1110" y="223" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="1110" dy="0">4  Store</tspan></text>
<text x="1110" y="278" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="1110" dy="0">Index text, vectors</tspan><tspan x="1110" dy="27.55">and citation metadata.</tspan></text>
<rect x="40" y="470" width="650" height="155" rx="12" fill="#F1ECF8" stroke="#7052A3" stroke-width="2"/>
<text x="60" y="508" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="60" dy="0">File source in Part 1</tspan></text>
<text x="60" y="563" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="60" dy="0">Upload the policy. The service manages ingestion.</tspan></text>
<rect x="750" y="470" width="650" height="155" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="770" y="508" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="770" dy="0">Existing index sources</tspan></text>
<text x="770" y="563" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="770" dy="0">Connect prepared indexes. Do not re-upload their</tspan><tspan x="770" dy="27.55">PDFs.</tspan></text>
</svg>

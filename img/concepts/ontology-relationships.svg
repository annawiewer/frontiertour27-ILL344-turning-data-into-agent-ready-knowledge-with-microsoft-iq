<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Read an ontology as explicit business relationships</title>
<desc id="desc">Schematic entity types, not a claim about any particular supplier or product.</desc>
<rect width="1440" height="760" fill="white"/>
<text x="40" y="54" fill="#000000" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="40" dy="0">Read an ontology as explicit business relationships</tspan></text>
<text x="40" y="101" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">Schematic entity types, not a claim about any particular supplier or product.</tspan></text>
<text x="40" y="727" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">CONCEPT ILLUSTRATION | Not a portal view, deployed state or saved query result.</tspan></text>
<rect x="40" y="190" width="390" height="180" rx="12" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/>
<text x="60" y="228" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="60" dy="0">Manufacturer</tspan></text>
<text x="60" y="283" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="60" dy="0">A business entity</tspan></text>
<rect x="525" y="190" width="390" height="180" rx="12" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/>
<text x="545" y="228" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="545" dy="0">Active substance</tspan></text>
<text x="545" y="283" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="545" dy="0">A business entity</tspan></text>
<rect x="1010" y="190" width="390" height="180" rx="12" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/>
<text x="1030" y="228" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="1030" dy="0">Medicinal product</tspan></text>
<text x="1030" y="283" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="1030" dy="0">A business entity</tspan></text>
<polyline points="430,280 525,280" fill="none" stroke="#107C41" stroke-width="3"/>
<polyline points="515,274 525,280 515,286" fill="none" stroke="#107C41" stroke-width="3"/>
<polyline points="1010,280 915,280" fill="none" stroke="#107C41" stroke-width="3"/>
<polyline points="925,274 915,280 925,286" fill="none" stroke="#107C41" stroke-width="3"/>
<text x="430" y="158" fill="#000000" font-size="18" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="430" dy="0">manufactures</tspan></text>
<text x="935" y="158" fill="#000000" font-size="18" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="935" dy="0">contains</tspan></text>
<rect x="40" y="445" width="650" height="185" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="60" y="483" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="60" dy="0">Document evidence</tspan></text>
<text x="60" y="538" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="60" dy="0">Use invoice and quality records for lot-level facts.</tspan><tspan x="60" dy="27.55">A mention is not an ontology edge.</tspan></text>
<rect x="750" y="445" width="650" height="185" rx="12" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/>
<text x="770" y="483" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="770" dy="0">Fabric evidence</tspan></text>
<text x="770" y="538" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="770" dy="0">Use returned relationships for business dependencies.</tspan><tspan x="770" dy="27.55">Do not invent an absent relationship.</tspan></text>
</svg>

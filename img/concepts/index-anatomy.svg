<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
<title id="title">A searchable passage is more than its text</title>
<desc id="desc">Illustrative index record. Actual fields and reference contents depend on the source.</desc>
<rect width="1440" height="880" fill="white"/>
<text x="40" y="54" fill="#000000" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="40" dy="0">A searchable passage is more than its text</tspan></text>
<text x="40" y="101" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">Illustrative index record. Actual fields and reference contents depend on the source.</tspan></text>
<text x="40" y="847" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">CONCEPT ILLUSTRATION | Not a portal view, deployed state or saved query result.</tspan></text>
<rect x="40" y="165" width="690" height="560" rx="12" fill="none" stroke="#00838A" stroke-width="2"/>
<rect x="60" y="185" width="650" height="115" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="80" y="217" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="80" dy="0">Text passage</tspan></text>
<text x="80" y="262" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="80" dy="0">Evidence to read and quote</tspan></text>
<rect x="60" y="315" width="650" height="115" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="80" y="347" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="80" dy="0">Vector</tspan></text>
<text x="80" y="392" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="80" dy="0">Numeric representation for meaning-based search</tspan></text>
<rect x="60" y="445" width="650" height="115" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="80" y="477" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="80" dy="0">Title, path, page</tspan></text>
<text x="80" y="522" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="80" dy="0">Metadata used to trace evidence to a document</tspan></text>
<rect x="60" y="575" width="650" height="115" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="80" y="607" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="80" dy="0">Chunk and parent IDs</tspan></text>
<text x="80" y="652" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="80" dy="0">Identifiers linking passage and source</tspan></text>
<rect x="850" y="185" width="550" height="155" rx="12" fill="#EAF4FC" stroke="#0078D4" stroke-width="2"/>
<text x="870" y="223" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="870" dy="0">Keyword retrieval</tspan></text>
<text x="870" y="278" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="870" dy="0">Find literal terms and exact identifiers.</tspan></text>
<rect x="850" y="380" width="550" height="155" rx="12" fill="#F1ECF8" stroke="#7052A3" stroke-width="2"/>
<text x="870" y="418" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="870" dy="0">Vector retrieval</tspan></text>
<text x="870" y="473" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="870" dy="0">Find passages with related meaning.</tspan></text>
<polyline points="730,250 790,250 790,265 850,265" fill="none" stroke="#0078D4" stroke-width="3"/>
<polyline points="840,259 850,265 840,271" fill="none" stroke="#0078D4" stroke-width="3"/>
<polyline points="730,380 790,380 790,455 850,455" fill="none" stroke="#7052A3" stroke-width="3"/>
<polyline points="840,449 850,455 840,461" fill="none" stroke="#7052A3" stroke-width="3"/>
<text x="855" y="606" fill="#000000" font-size="21" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="855" dy="0">Hybrid retrieval combines keyword and</tspan><tspan x="855" dy="30.45">vector signals.</tspan><tspan x="855" dy="30.45">Semantic ranking helps order candidate</tspan><tspan x="855" dy="30.45">results.</tspan><tspan x="855" dy="30.45">Neither creates missing source evidence.</tspan></text>
</svg>

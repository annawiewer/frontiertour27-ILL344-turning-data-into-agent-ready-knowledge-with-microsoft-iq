<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">Follow a citation instead of trusting the wording</title>
<desc id="desc">Illustrative identifiers only. Inspect the actual response, references and activity in your run.</desc>
<rect width="1440" height="850" fill="white"/>
<text x="40" y="54" fill="#000000" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="40" dy="0">Follow a citation instead of trusting the wording</tspan></text>
<text x="40" y="101" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">Illustrative identifiers only. Inspect the actual response, references and activity in your run.</tspan></text>
<text x="40" y="817" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="40" dy="0">CONCEPT ILLUSTRATION | Not a portal view, deployed state or saved query result.</tspan></text>
<rect x="40" y="175" width="340" height="210" rx="12" fill="#EAF4FC" stroke="#0078D4" stroke-width="2"/>
<text x="60" y="213" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="60" dy="0">1  Answer marker</tspan></text>
<text x="60" y="268" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="60" dy="0">A claim ends in [ref:3].</tspan><tspan x="60" dy="27.55">Find reference id 3.</tspan></text>
<rect x="490" y="175" width="420" height="260" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="510" y="213" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="510" dy="0">2  Reference</tspan></text>
<text x="510" y="268" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="510" dy="0">id: 3</tspan><tspan x="510" dy="27.55">activitySource: 2</tspan><tspan x="510" dy="27.55">Source metadata and evidence</tspan></text>
<rect x="1020" y="175" width="380" height="260" rx="12" fill="#F1ECF8" stroke="#7052A3" stroke-width="2"/>
<text x="1040" y="213" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="1040" dy="0">3  Activity</tspan></text>
<text x="1040" y="268" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="1040" dy="0">id: 2</tspan><tspan x="1040" dy="27.55">Source call and sub-query</tspan><tspan x="1040" dy="27.55">Timing, warnings or errors</tspan></text>
<polyline points="380,280 490,280" fill="none" stroke="#0078D4" stroke-width="3"/>
<polyline points="480,274 490,280 480,286" fill="none" stroke="#0078D4" stroke-width="3"/>
<polyline points="910,280 1020,280" fill="none" stroke="#7052A3" stroke-width="3"/>
<polyline points="1010,274 1020,280 1010,286" fill="none" stroke="#7052A3" stroke-width="3"/>
<rect x="490" y="530" width="910" height="155" rx="12" fill="#E5F5F4" stroke="#00838A" stroke-width="2"/>
<text x="510" y="568" fill="#000000" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="600"><tspan x="510" dy="0">4  Check the underlying source</tspan></text>
<text x="510" y="623" fill="#000000" font-size="19" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="510" dy="0">For an indexed reference, inspect title, path and page metadata when</tspan><tspan x="510" dy="27.55">returned.</tspan></text>
<polyline points="700,435 700,530" fill="none" stroke="#00838A" stroke-width="3"/>
<polyline points="694,520 700,530 706,520" fill="none" stroke="#00838A" stroke-width="3"/>
<text x="45" y="513" fill="#000000" font-size="23" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="45" dy="0">Configured</tspan><tspan x="45" dy="33.35">is not the same as</tspan><tspan x="45" dy="33.35">called or cited.</tspan></text>
<text x="65" y="748" fill="#000000" font-size="20" font-family="Segoe UI,Arial,sans-serif" font-weight="400"><tspan x="65" dy="0">Fabric and Work IQ references have different shapes. A citation still needs evidence that supports the claim.</tspan></text>
</svg>

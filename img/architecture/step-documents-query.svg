<text x="431" y="139" fill="#000000" font-size="15" font-family="Segoe UI,Arial,sans-serif"><tspan x="431" dy="0">SEARCH | Three-source KB</tspan><tspan x="431" dy="22.5">Policy and indexed evidence</tspan><tspan x="431" dy="22.5">Sources can be skipped per query</tspan></text>

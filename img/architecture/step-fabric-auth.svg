<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="350" viewBox="0 0 1560 350" role="img" aria-labelledby="title desc">
<title id="title">Authorize live Fabric retrieval as the signed-in user</title><desc id="desc">SECTION MAP | Orange: current focus. Blue: context. Read left to right.</desc>
<rect width="1560" height="350" fill="#ffffff"/>
<text x="30" y="38" fill="#000000" font-size="26" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Authorize live Fabric retrieval as the signed-in user</tspan></text>
<text x="30" y="74" fill="#000000" font-size="16" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">SECTION MAP | Orange: current focus. Blue: context. Read left to right.</tspan></text>
<rect x="30" y="110" width="345" height="135" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="46" y="139" fill="#000000" font-size="15" font-family="Segoe UI,Arial,sans-serif"><tspan x="46" dy="0">USER | Fabric-enabled account</tspan><tspan x="46" dy="22.5">Use the intended tenant</tspan><tspan x="46" dy="22.5">Workspace access is required</tspan></text>
<rect x="415" y="110" width="345" height="135" rx="12" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text x="431" y="139" fill="#000000" font-size="15" font-family="Segoe UI,Arial,sans-serif"><tspan x="431" dy="0">ENTRA | Delegated token</tspan><tspan x="431" dy="22.5">Search audience</tspan><tspan x="431" dy="22.5">Not the Search admin key</tspan></text>
<rect x="800" y="110" width="345" height="135" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="816" y="139" fill="#000000" font-size="15" font-family="Segoe UI,Arial,sans-serif"><tspan x="816" dy="0">LOCAL | Retrieval request</tspan><tspan x="816" dy="22.5">Pass query-source authorization</tspan><tspan x="816" dy="22.5">Keep the token private</tspan></text>
<rect x="1185" y="110" width="345" height="135" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="1201" y="139" fill="#000000" font-size="15" font-family="Segoe UI,Arial,sans-serif"><tspan x="1201" dy="0">FABRIC | Source access</tspan><tspan x="1201" dy="22.5">Read permitted ontology facts</tspan><tspan x="1201" dy="22.5">Not a bulk copy into Search</tspan></text>
<polyline points="375,175 415,175" fill="none" stroke="#0078D4" stroke-width="2"/><polyline points="406,170 415,175 406,180" fill="none" stroke="#0078D4" stroke-width="2"/>
<polyline points="760,175 800,175" fill="none" stroke="#0078D4" stroke-width="2"/><polyline points="791,170 800,175 791,180" fill="none" stroke="#0078D4" stroke-width="2"/>
<polyline points="1145,175 1185,175" fill="none" stroke="#0078D4" stroke-width="2"/><polyline points="1176,170 1185,175 1176,180" fill="none" stroke="#0078D4" stroke-width="2"/>
<text x="30" y="301" fill="#000000" font-size="16" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Learning sequence, not a live status report. Use the section&#x27;s read-back and evidence checks.</tspan></text>

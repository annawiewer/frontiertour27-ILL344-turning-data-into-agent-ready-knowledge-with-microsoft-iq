<text x="46" y="361" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif"><tspan x="46" dy="0">PART 1 | Existing Search indexes</tspan><tspan x="46" dy="25.5">Supplier evidence + approved</tspan><tspan x="46" dy="25.5">commitments</tspan><tspan x="46" dy="25.5">Searchable chunks, vectors and</tspan><tspan x="46" dy="25.5">metadata</tspan></text>

<text x="30" y="906" fill="#000000" font-size="16" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">Solid arrows show the logical evidence/model boundary, not packet order or a successful live query.</tspan><tspan x="30" dy="24.0">Parts 2 and 3 branch from Part 1. Part 4 combines them. Part 5 intentionally returns to the Part 1 sources.</tspan><tspan x="30" dy="24.0">Services and seed data exist before the lab. Notebooks mainly create Search objects, not new Azure services.</tspan></text>

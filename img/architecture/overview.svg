<text x="46" y="181" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif"><tspan x="46" dy="0">PART 1 | Purchasing policy PDF</tspan><tspan x="46" dy="25.5">Direct file upload into Search</tspan><tspan x="46" dy="25.5">Search chunks, embeds and indexes it</tspan></text>

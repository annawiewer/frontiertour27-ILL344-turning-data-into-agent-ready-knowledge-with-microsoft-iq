<text x="546" y="161" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif"><tspan x="546" dy="0">PRECONFIGURED | Azure OpenAI</tspan><tspan x="546" dy="25.5">gpt-5.4: planning / answer synthesis</tspan><tspan x="546" dy="25.5">text-embedding-3-large: text to vectors</tspan></text>
<rect x="530" y="335" width="470" height="240" rx="12" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text x="546" y="366" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif"><tspan x="546" dy="0">AZURE AI SEARCH | Foundry IQ retrieval</tspan><tspan x="546" dy="25.5">Indexes: vector + text search, semantic</tspan><tspan x="546" dy="25.5">rank</tspan><tspan x="546" dy="25.5">Knowledge sources: connections to</tspan><tspan x="546" dy="25.5">evidence</tspan><tspan x="546" dy="25.5">Knowledge bases: retrieval orchestration</tspan><tspan x="546" dy="25.5">Six KB variants created across five</tspan><tspan x="546" dy="25.5">parts</tspan></text>

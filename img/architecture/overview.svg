<text x="30" y="74" fill="#000000" font-size="16" font-family="Segoe UI,Arial,sans-serif"><tspan x="30" dy="0">SERVICE MAP | Read sources &gt; retrieval &gt; consumer. Orange highlights the main objects you build.</tspan></text>

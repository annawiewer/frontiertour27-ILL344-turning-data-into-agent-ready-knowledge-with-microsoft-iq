<text x="1106" y="366" fill="#000000" font-size="17" font-family="Segoe UI,Arial,sans-serif"><tspan x="1106" dy="0">LOCAL | Jupyter / Agent Framework</tspan><tspan x="1106" dy="25.5">Parts 1-4: call Search, display KB</tspan><tspan x="1106" dy="25.5">answer</tspan><tspan x="1106" dy="25.5">Part 5: call extractive KB through MCP</tspan><tspan x="1106" dy="25.5">Local agent + OpenAI synthesize the</tspan><tspan x="1106" dy="25.5">answer</tspan><tspan x="1106" dy="25.5">No hosted Foundry agent is deployed</tspan></text>
